version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai_academic_coach_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_academic_coach}
      POSTGRES_USER: ${POSTGRES_USER:-academic_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academic_coach_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-academic_coach} -d ${POSTGRES_DB:-ai_academic_coach}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
